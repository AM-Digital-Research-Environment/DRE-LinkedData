name: CI

# The whole check suite. It runs on every branch push and pull request, and
# the release workflow calls it (workflow_call) on the tagged tree before it
# packages anything, so a release is gated on exactly what CI checks.
#
# Actions are pinned to commit SHAs with the release in a comment; Dependabot
# (.github/dependabot.yml) keeps the pins current.

on:
  push:
    # Branches only: a tag push runs this suite through release.yml.
    branches: ['**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, zlib
          coverage: none
          tools: composer:v2

      # `composer check` runs three Node steps: the design-token lint vendored
      # from DRE-theme, the block script's syntax check and its unit tests
      # (node --test, no npm install).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Lint, design tokens and test
        run: composer check

  coding-standard:
    name: Coding standard (PSR-12)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # phpcs as a setup-php tool, like PHPStan below: the module installs
      # nothing with Composer, development tools included.
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: phpcs:4.0.4

      - name: PHP_CodeSniffer (phpcs.xml.dist)
        run: phpcs

  omeka-smoke:
    name: Omeka S 4.2.1 / PHP 8.5 (smoke test, PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMEKA_VERSION: '4.2.1'
      OMEKA_SHA256: cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, json, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2, phpstan:2.3.5

      - name: Download official Omeka S release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/omeka-s.zip"
          curl -fsSL "https://github.com/omeka/omeka-s/releases/download/v${OMEKA_VERSION}/omeka-s-${OMEKA_VERSION}.zip" -o "$archive"
          echo "${OMEKA_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "OMEKA_PATH=$RUNNER_TEMP/omeka-s" >> "$GITHUB_ENV"

      - name: Run Omeka integration smoke test
        run: composer integration

      # The module against the real Omeka S and Laminas classes, which this job
      # has unpacked anyway (phpstan.neon.dist). Runs even when the smoke test
      # fails, so one push reports both.
      - name: Static analysis (PHPStan level 6)
        if: ${{ !cancelled() }}
        run: phpstan analyse --no-progress --error-format=github --memory-limit=1G
