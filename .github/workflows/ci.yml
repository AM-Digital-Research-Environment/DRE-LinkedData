name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, zlib
          coverage: none
          tools: composer:v2

      # The design-token lint (scripts/check-design-tokens.mjs) is a Node script
      # vendored from DRE-theme; `composer check` runs it.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Lint, design tokens and test
        run: composer check

  omeka-smoke:
    name: Omeka S 4.2.1 / PHP 8.5
    runs-on: ubuntu-latest
    env:
      OMEKA_VERSION: '4.2.1'
      OMEKA_SHA256: cc27d1c7aca0209523d19aa285f4a08e29e34950dcc446951a7c1311de348e82

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, json, mbstring, zlib, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Download official Omeka S release
        shell: bash
        run: |
          archive="$RUNNER_TEMP/omeka-s.zip"
          curl -fsSL "https://github.com/omeka/omeka-s/releases/download/v${OMEKA_VERSION}/omeka-s-${OMEKA_VERSION}.zip" -o "$archive"
          echo "${OMEKA_SHA256}  ${archive}" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP"
          echo "OMEKA_PATH=$RUNNER_TEMP/omeka-s" >> "$GITHUB_ENV"

      - name: Run Omeka integration smoke test
        run: composer integration
