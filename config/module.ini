[info]
name              = "DRE Linked Data"
description       = "Linked Open Data for the Africa Multiple DRE Omeka S instance. Gives every public item, item set and media a dereferenceable URI at /resource/{id} that answers browsers with the record page and RDF clients with Turtle, N-Triples or JSON-LD. The RDF is a clean projection rather than Omeka's internal JSON-LD: Omeka bookkeeping is dropped, private values and private links never appear, and Wikidata, GND and Library of Congress identifiers become owl:sameAs / skos:exactMatch links. An admin-triggered job writes a gzipped N-Triples dump, ready to load into Apache Jena Fuseki, and /linked-data/void serves a VoID/DCAT description of the dataset. A page block presents all of it to visitors in the DRE theme."
author            = "Frédérick Madore"
configurable      = true
version           = "0.2.0"
module_link       = "https://github.com/AM-Digital-Research-Environment/DRE-LinkedData"
author_link       = "https://www.frederickmadore.com"
omeka_version_constraint = "^4.2.0"
